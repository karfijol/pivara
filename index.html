<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pivovara · Skladište</title>
  <link rel="icon" type="image/png" href="icons/favicon-32.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
  <meta name="theme-color" content="#1E1915">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pivovara">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="splash">
    <div class="splash-box">
      <img class="splash-logo pivara-logo" src="icons/pivara-logo.png" alt="PIVARA">
      <div class="splash-title">Skladište · proizvodnja · HACCP</div>
      <div class="spinner"></div>
      <div id="splash-text">Pokrećem…</div>
      <div class="splash-note">Prvo otvaranje traje malo duže (učitava se oko 20 MB), poslije je brže.</div>
    </div>
  </div>
  <div id="app"></div>
  <noscript>Za rad programa uključite JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
  <script>
    // instalacija na početni zaslon (Android / Chrome / Edge) – tipka se pojavi u izborniku
    window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); window.__installPrompt = e;
      document.dispatchEvent(new Event("pivovara-installable")); });
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
</html>
